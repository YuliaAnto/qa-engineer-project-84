---
  - summary: 
      Локализация интерфейса работает частично (русский)
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть магазин
      - Переключить язык интерфейса с английского на русский
      - Посмотреть на перевод всего текста на странице
    expected-result: 
      Все элементы на странице должны быть переведены на выбранный язык
    actual-result: 
      Название товаров и их описание не изменяются при смене языка.

  - summary: 
      Отображение товара в каталоге
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть магазин
      - Просмотреть любой товар в списке
    expected-result: 
      Отображается название, рейтинг, цена, цена со скидкой
    actual-result: 
      Не отображается рейтинг

  - summary: 
      Страница товара
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть страницу каталога
    expected-result: 
      Все элементы на любой карточке товара должны быть ровными
    actual-result: 
      Карточка товара оформлена не ровно, кнопка «Добавить в корзину»  разного размера,высоты.

  - summary: 
      Переход по хэштегу на странице товара
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть страницу любого товара
      - Найти на странице товара хэштег
      - Кликнуть на хэштег
    expected-result: 
      Пользователь переходит в категорию с товарами по данному хэштегу
    actual-result: 
      Не удается перейти, хэштег не работает

  - summary: 
      Добавление нескольких товаров в корзину (разных)
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Добавить в корзину товар 1
      - Перейти к следующему товару
      - Добавить в корзину товар 1
      - Перейти в корзину
    expected-result: 
      В корзине ровно отображаются все товары,элементы
    actual-result: 
      Криво отображается количество товаров, кнопка «Удалить»

  - summary: 
      Оформление заказа
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Перейти в корзину
      - Нажать кнопку «Оформить заказ»
    expected-result: 
      Пользователь переходит на страницу оплаты
    actual-result: 
      Нет перехода на страницу оплаты, появляется моддальное окно « Заказ успешно оформлен» со списком товаров.Нет возможности внести данные для оплаты

    - summary: 
      Закрытие окна заказа
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Добавить любой товар в корзину
      - Перейти в корзину
      - Нажать кнопку «Оформить заказ»
      - Нажать кнопку «Закрыть»
    expected-result: 
      Окно заказа закрывается, корзина пуста, пользователь возвращается в каталог
    actual-result: 
      После закрытие окна корзина остается полной со всем списком товаров   

    - summary: 
      Проверка DevTools
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть вкладку Network в DevTools
      - Добавить товар в корзину
    expected-result: 
      Все запросы уходят и приходят без ошибок, страница не перезагружается
    actual-result: 
      При добавлении товара в корзину в консоли DevTools наблюдаются ошибки - Failed to load resource и Failed to load resource the server responded with a status of 500  
