---
  - summary: 
      Локализация интерфейса работает частично
    environment: 
      Windows 11
      Google Chrome 122
    steps-to-reproduce: |
      - Открыть магазин
      - Переключить язык интерфейса с английского на русский
      - Посмотреть на перевод всего текста на странице
    expected-result: 
      Все элементы на странице должны быть переведены на выбранный язык
    actual-result: 
      Название товаров и их описание не изменяются при смене языка.
