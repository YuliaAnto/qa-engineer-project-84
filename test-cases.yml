---
- summary: 
    Отображение товара в каталоге
  requirement: 
    На странице каталога выводятся название, рейтинг, цена со скидкой и без
  prerequisites: 
   Открыта страница каталога
  test-data: |
   Empty
  steps:
    - Просмотреть любой товар в списке
  expected-result: 
    Отображаются название, рейтинг, цена, цена со скидкой (если есть)

- summary: 
    Добавление товара в корзину
  requirement: 
    Пользователь может добавлять товары в корзину
  prerequisites:
    Открыта страница товара
  test-data: |
    Empty
  steps:
    - Нажать кнопку "Добавить в корзину"
  expected-result: 
    Товар добавлен в корзину, пользователь остался на странице товара

- summary:
    Поиск товара по ключевому слову
  requirement: 
    Пользователь может искать товары по ключевому слову
  prerequisites:
    Открыта страница каталога
  test-data: |
    Empty
  steps:
    - Ввести ключевое слово «mascara» в строку поиска 
    - Нажать «Найти»
  expected_result: 
    Отобразились товары, содержащие ключевое слово в названии

- summary: 
    Фильтрация товаров по категории
  requirement: 
    Пользователь может фильтровать товары
  prerequisites:
    Открыта страница каталога
  test-data: |
   Empty
  steps: 
    - Выбрать категорию «beauty»
  expected_result:
    Отобразились только товары выбранной категории
