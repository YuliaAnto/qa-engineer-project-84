---
- summary: 
    Отображение товара в каталоге
  requirement: 
    На странице каталога выводятся название, рейтинг, цена со скидкой и без
  prerequisites: 
   Открыта страница каталога
  test-data: |
   Empty
  steps:
    - Просмотреть любой товар в списке
  expected-result: 
    Отображаются название, рейтинг, цена, цена со скидкой (если есть)

- summary: 
    Добавление товара в корзину
  requirement: 
    Пользователь может добавлять товары в корзину
  prerequisites:
    Открыта страница товара
  test-data: |
    Empty
  steps:
    - Нажать кнопку "Добавить в корзину"
  expected-result: 
    Товар добавлен в корзину, пользователь остался на странице товара

- summary:
    Поиск товара по ключевому слову
  requirement: 
    Пользователь может искать товары по ключевому слову
  prerequisites:
    Открыта страница каталога
  test-data: |
    Empty
  steps:
    - Ввести ключевое слово «mascara» в строку поиска 
  expected-result: 
    Отобразились товары, содержащие ключевое слово в названии

- summary: 
    Фильтрация товаров по категории
  requirement: 
    Пользователь может фильтровать товары
  prerequisites:
    Открыта страница каталога
  test-data: |
   Empty
  steps: 
    - Открытие списка категорий
    - Выбрать категорию «beauty»
  expected-result:
    Отобразились только товары выбранной категории

- summary: 
    Страница товара
  requirement: 
    Пользователь может просматривать подробную информацию о товаре
  prerequisites:
    Открыта страница каталога
  test-data: |
    Empty
  steps:
    - Кликнуть на любой товар в списке
  expected-result: 
    Открывается страница выбранного товара

- summary:
    Фильтр по производителю
  requirement: 
    Пользователь может фильтровать товары
  prerequisites: 
    Открыта страница каталога
  test-data: |
    Производитель = Dior
  steps:
    - Открыть фильтр Производитель
    - Выбрать Dior
  expected-result: 
    Отображаются только товары выбранного производителя

- summary: 
    Фильтр по цене
  requirement: 
    Пользователь может фильтровать товары
  prerequisites: 
    Открыта страница каталога
  test-data: |
    Мин. цена = 1
    Макс. цена = 10
  steps:
    - Открыть фильтр Цена
    - Ввести минимальную и максимальную цену
    - Нажать кнопку Применить
  expected-result: 
    Отображаются только товары в заданном ценовом диапазоне

- summary: 
    Фильтр по наличию
  requirement:
    Пользователь может фильтровать товары
  prerequisites: 
    Открыта страница каталога
  test-data: |
    Empty
  steps:
    - Открыть фильтр Наличие
    - Выбрать «В наличии»
  expected-result: 
    Отображаются только товары, которые есть в наличии

- summary: 
    Добавление нескольких товаров в корзину (одинаковых)
  requirement: 
    Пользователь может добавлять товары в корзину
  prerequisites: 
    Открыта страница товара
  test-data: |
    Количество товара = 3
  steps:
    - Нажать кнопку Добавить в корзину 3 раза
  expected-result: 
    В корзине отображается 3 единицы одинакового товара

- summary:
    Добавление нескольких товаров в корзину (разных)
  requirement: 
    Пользователь может добавлять товары в корзину
  prerequisites:
    Открыта страница каталога
  test-data: |
    Товар 1 = лак для ногтей
    Товар 2 = красная помада
  steps:
    - Добавить в корзину Товар 1
    - Перейти к следующему товару
    - Добавить в корзину Товар 2
  expected-result: 
    В корзине отображаются два разных товара

- summary: 
    Удаление товара из корзины
  requirement: 
    Пользователь может удалять товары из корзины
  prerequisites:
    В корзине есть хотя бы один товар
  test-data: |
    Empty
  steps:
    - Открыть корзину
    - Нажать кнопку Удалить рядом с товаром
  expected-result:
    Товар удален из корзины

- summary: 
    Полная очистка корзины
  requirement:
    Пользователь может удалять товары из корзины
  prerequisites:
    В корзине есть несколько товаров
  test-data: |
    Empty
  steps:
    - Открыть корзину
    - Нажать кнопку «Очистить корзину»
  expected-result: 
    Корзина полностью пуста

- summary: 
    Навигация по страницам каталога
  requirement: 
    Пользователь может просматривать товары постраничным выводом
  prerequisites: 
    В каталоге более 10 товаров
  test-data: |
    Страница = 2
  steps:
    - Открыть страницу каталога
    - Нажать на кнопку  «Следующая»
  expected-result:
    Отображается вторая страница каталога

- summary: 
    Переход по хэштегу на странице товара
  requirement:
    Пользователь может просматривать подробную информацию о товаре
  prerequisites: 
    Открыта страница товара
  test-data: |
    Хэштег = #beauty
  steps:
    - Найти на странице товара хэштег
    - Кликнуть на хэштег
  expected-result: 
    Пользователь переходит в категорию с товарами по данному хэштегу

- summary:
    Изменение языка
  requirement:
    Пользователь может переключить язык интерфейса
  prerequisites:
    Открыта главная страница сайта
  test-data: |
    Язык = Русский
  steps:
    - Нажать на кнопку переключения языка
    - Выбрать «Русский»
  expected-result: Весь интерфейс сайта отображается на английском языке
